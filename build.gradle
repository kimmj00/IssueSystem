import com.github.gradle.node.npm.task.NpmTask

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// Spring MVC가 요청 파라미터 이름을 JAR에서도 읽을 수 있도록 보존한다.
tasks.withType(JavaCompile).configureEach {
	if (!options.compilerArgs.contains('-parameters')) {
		options.compilerArgs.add('-parameters')
	}
}

repositories {
	mavenCentral()
}

def frontendDir = "$projectDir/issue-system-frontend"
def frontendBuildWorkspace = "$projectDir/.gradle/frontend-build"
def frontendBuildDir = "$frontendBuildWorkspace/build"
def backendStaticDir = "$projectDir/src/main/resources/static"

// IDE/PATH에 설치된 Node와 무관하게 검증한 버전을 사용한다.
node {
	version = file("$frontendDir/.node-version").text.trim()
	download = true
	// npm ci가 실행 중인 개발 서버의 node_modules를 삭제하지 않도록 분리한다.
	nodeProjectDir = file(frontendBuildWorkspace)
	npmInstallCommand = 'ci'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.apache.poi:poi-ooxml:5.2.5'
	implementation 'org.apache.poi:poi:5.2.5'
	implementation 'org.apache.xmlbeans:xmlbeans:5.2.0'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 전용 PostgreSQL을 명시한 경우에만 실제 검색 SQL 통합 테스트를 실행한다.
	['url', 'user', 'password'].each { key ->
		def value = System.getenv("SEARCH_TEST_POSTGRES_${key.toUpperCase()}")
		if (value != null) systemProperty "search.test.postgres.${key}", value
	}
}

/**
 * 프론트 정적 파일 폴더 비우기
 * - 이전 build 결과가 남아 있으면 꼬일 수 있어서 먼저 삭제
 */
tasks.register('cleanFrontendStatic', Delete) {
	delete backendStaticDir
}

/**
 * 빌드 소스를 복사하되 빌드 전용 의존성과 결과물은 보존한다.
 */
tasks.register('prepareFrontendBuild', Sync) {
	from frontendDir
	into frontendBuildWorkspace
	exclude 'node_modules/**', 'build/**'
	preserve {
		include 'node_modules/**', 'build/**'
	}
}

/**
 * 잠금 파일에 고정된 프론트 의존성 설치
 */
tasks.named('npmInstall') {
	dependsOn 'prepareFrontendBuild'
	args.set(['--include=dev', '--include=optional'])
	inputs.property('frontendNodeVersion', node.version)
	inputs.files(
		file("$frontendDir/.npmrc"),
		file("$frontendDir/scripts/verify-build-tools.mjs"),
		file("$frontendDir/scripts/node-version.mjs")
	)
}

// 개발/테스트/감사도 IDE의 전역 Node 대신 같은 전용 런타임을 사용한다.
[
	npmBuild: ['run', 'build'],
	npmTest: ['test'],
	npmAudit: ['run', 'audit']
].each { taskName, commandArgs ->
	tasks.register(taskName, NpmTask) {
		group = 'frontend'
		description = "프로젝트 전용 Node로 npm ${commandArgs.join(' ')} 실행"
		dependsOn 'npmInstall'
		args.set(commandArgs)
	}
}

// 개발 서버는 원본 소스와 개발용 node_modules를 사용한다.
// 필요한 의존성은 start.mjs가 확인하고 복구한다.
tasks.register('npmStart', NpmTask) {
	group = 'frontend'
	description = '프로젝트 전용 Node로 프론트엔드 개발 서버 실행'
	workingDir = file(frontendDir)
	args.set(['start'])
}

/**
 * 프론트 build 결과를 Spring Boot static 폴더로 복사
 */
tasks.register('copyFrontendBuild', Copy) {
	dependsOn 'cleanFrontendStatic', 'npmBuild'
	from frontendBuildDir
	into backendStaticDir
}

/**
 * resources 처리 전에 프론트 빌드 포함
 */
tasks.named('processResources') {
	dependsOn 'copyFrontendBuild'
}
